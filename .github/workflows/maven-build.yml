# =============================================================================
# .github/workflows/maven-build.yml
# Purpose: Compile and unit-test the multi-module Maven project on every push
#          and pull request to main. Does not build Docker images or touch ECR.
# Related: build-push.yml owns the ARM64 image build and ECR push path.
# =============================================================================

# =============================================================================
# Workflow name
# Purpose: Identifies this workflow in the GitHub Actions UI.
# =============================================================================
name: Java CI with Maven

# =============================================================================
# Trigger events
# Purpose: Run on changes aimed at main (push or pull request).
# =============================================================================
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# =============================================================================
# Jobs
# Purpose: Defines the Maven package job.
# =============================================================================
jobs:

  # =============================================================================
  # Build job
  # Purpose: Compile all modules and run unit tests with JDK 17.
  # =============================================================================
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        java: ["17"]

    steps:

      # =============================================================================
      # Checkout
      # Purpose: Fetch the repository at the commit under test.
      # =============================================================================
      - name: Checkout
        uses: actions/checkout@v4

      # =============================================================================
      # JDK setup
      # Purpose: Install the matrix JDK and enable the Maven dependency cache.
      # =============================================================================
      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ matrix.java }}
          distribution: adopt
          cache: maven

      # =============================================================================
      # Maven package
      # Purpose: Package the reactor. -B keeps Maven non-interactive in CI logs.
      # =============================================================================
      - name: Build with Maven
        run: mvn -B package --file pom.xml
